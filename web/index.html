<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Connect to ROS robots, drive, navigate and inspect live status with Mobile ROS.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mobile ROS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mobile ROS</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Email confirmation is followed by an explicit sign-in. Do not retain implicit
    // callback credentials in browser history or let them become Flutter route names.
    if (/^#(?:access_token|refresh_token|error)=/.test(window.location.hash)) {
      const confirmation = new URLSearchParams(window.location.hash.slice(1));
      if (confirmation.get('type') === 'recovery' && confirmation.get('access_token')) {
        // A password reset link: the app sets the new password with this short-lived token. It stays in
        // memory only (never the address bar, history or storage).
        window.mobileRosRecovery = confirmation.get('access_token');
        window.history.replaceState(null, '', window.location.pathname + '?password_reset=ready#/my-robots');
      } else {
        const result = confirmation.has('error') ? 'failed' : 'complete';
        window.history.replaceState(null, '', window.location.pathname + '?email_confirmation=' + result + '#/my-robots');
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
